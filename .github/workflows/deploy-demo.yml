name: Deploy Demo

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

env:
  MOCK_ENV: demo
  IMAGE_TAG: practice-api:${{ github.sha }}

jobs:
  deploy-demo:
    name: Mock Deploy → Demo
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4

      - name: Checkov (env config)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: dockerfile,docker_compose
          soft_fail: false

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Trivy verify digest
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Attach SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-demo-${{ github.sha }}
          image: ${{ env.IMAGE_TAG }}
          format: spdx-json

      - name: Mock registry push
        run: |
          echo "::notice::MOCK push ${{ env.IMAGE_TAG }} → mock://registry/demo/${{ github.sha }}"
          echo "MOCK_REGISTRY=mock://registry/demo/${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Mock deploy to demo environment
        run: |
          docker run -d --name api -p 8000:8000 \
            -e ENVIRONMENT=demo \
            -e APP_VERSION=${{ github.sha }} \
            ${{ env.IMAGE_TAG }}
          sleep 5
          curl -sf http://localhost:8000/health
          echo "::notice::MOCK deployed to demo environment"

      - name: Schemathesis API tests
        run: |
          pip install schemathesis
          schemathesis run \
            --base-url=http://localhost:8000 \
            --checks all \
            openapi/openapi.yaml

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000
          allow_issue_writing: false

      - name: Full E2E tests
        run: |
          pip install -r requirements-dev.txt
          BASE_URL=http://localhost:8000 pytest tests/e2e -v -m e2e

      - name: Mock promote digest (demo-approved)
        run: echo "::notice::MOCK promote ${{ env.IMAGE_TAG }} → demo-approved"

      - name: Write deploy record
        if: always()
        run: |
          mkdir -p deploy-artifacts
          cat > deploy-artifacts/deploy-demo.json <<EOF
          {
            "environment": "demo",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "image": "${{ env.IMAGE_TAG }}",
            "mock_registry": "${{ env.MOCK_REGISTRY }}",
            "promoted_tag": "demo-approved",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "simulated-success"
          }
          EOF

      - name: Upload deploy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-demo-${{ github.sha }}
          path: deploy-artifacts/

      - name: Stop container
        if: always()
        run: docker rm -f api
