name: Deploy Test

on:
  push:
    branches: [dev]

permissions:
  contents: read
  security-events: write
  checks: write

env:
  MOCK_ENV: test
  IMAGE_TAG: practice-api:${{ github.sha }}
  REPORTS_DIR: reports
  PYTHON_VERSION: "3.12"

jobs:
  deploy-test:
    name: Mock Deploy → Test
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p "${{ env.REPORTS_DIR }}"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: sarif
          output: ${{ env.REPORTS_DIR }}/trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy image scan (JSON)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: json
          output: ${{ env.REPORTS_DIR }}/trivy-image.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-spdx-test-${{ github.sha }}
          output-file: ${{ env.REPORTS_DIR }}/sbom.spdx.json
          image: ${{ env.IMAGE_TAG }}
          format: spdx-json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-cyclonedx-test-${{ github.sha }}
          output-file: ${{ env.REPORTS_DIR }}/sbom.cyclonedx.json
          image: ${{ env.IMAGE_TAG }}
          format: cyclonedx-json

      - name: Upload Trivy SARIF
        if: always() && hashFiles('reports/trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-test

      - name: Mock registry push
        run: |
          echo "::notice::MOCK push ${{ env.IMAGE_TAG }} → mock://registry/test/${{ github.sha }}"
          echo "MOCK_REGISTRY=mock://registry/test/${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Mock deploy to test environment
        run: |
          docker run -d --name api -p 8000:8000 \
            -e ENVIRONMENT=test \
            -e APP_VERSION=${{ github.sha }} \
            ${{ env.IMAGE_TAG }}
          sleep 5
          curl -sf http://localhost:8000/health | tee "${{ env.REPORTS_DIR }}/health-deploy.json"
          echo "::notice::MOCK deployed to test environment"

      - name: Schemathesis API tests
        run: |
          pip install schemathesis
          schemathesis run \
            --base-url=http://localhost:8000 \
            --checks all \
            --report junit \
            --report-junit-path "${{ env.REPORTS_DIR }}/junit-schemathesis.xml" \
            openapi/openapi.yaml

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000
          allow_issue_writing: false
          cmd_options: "-a -J reports/zap-report.json -r reports/zap-report.html"

      - name: Full E2E tests
        run: |
          pip install -r requirements-dev.txt
          BASE_URL=http://localhost:8000 pytest tests/e2e -v -m e2e \
            --junitxml="${{ env.REPORTS_DIR }}/junit-e2e.xml"

      - name: Mock promote digest (test-approved)
        run: echo "::notice::MOCK promote ${{ env.IMAGE_TAG }} → test-approved"

      - name: Write deploy manifest
        if: always()
        run: |
          cat > "${{ env.REPORTS_DIR }}/deploy-test.json" <<EOF
          {
            "environment": "test",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "image": "${{ env.IMAGE_TAG }}",
            "mock_registry": "${{ env.MOCK_REGISTRY }}",
            "promoted_tag": "test-approved",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "simulated-success"
          }
          EOF

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate pipeline summary
        if: always()
        run: |
          python .github/scripts/generate-pipeline-summary.py \
            --reports-dir "${{ env.REPORTS_DIR }}" \
            --workflow "Deploy Test" \
            --environment test \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --ref "${{ github.ref }}" \
            --output "${{ env.REPORTS_DIR }}/pipeline-summary.json"

      - name: Upload consolidated security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-test-${{ github.sha }}
          path: ${{ env.REPORTS_DIR }}/
          retention-days: 90

      - name: Publish E2E test results
        if: always() && hashFiles('reports/junit-e2e.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: E2E Tests (Test)
          path: reports/junit-e2e.xml
          reporter: java-junit
          fail-on-error: true

      - name: Publish Schemathesis results
        if: always() && hashFiles('reports/junit-schemathesis.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: Schemathesis (Test)
          path: reports/junit-schemathesis.xml
          reporter: java-junit
          fail-on-error: true

      - name: Stop container
        if: always()
        run: docker rm -f api
