name: Deploy Test

on:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  MOCK_ENV: test
  IMAGE_TAG: practice-api:${{ github.sha }}

jobs:
  deploy-test:
    name: Mock Deploy → Test
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-test-${{ github.sha }}
          image: ${{ env.IMAGE_TAG }}
          format: spdx-json

      - name: Mock registry push
        run: |
          echo "::notice::MOCK push ${{ env.IMAGE_TAG }} → mock://registry/test/${{ github.sha }}"
          echo "MOCK_REGISTRY=mock://registry/test/${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Mock deploy to test environment
        run: |
          docker run -d --name api -p 8000:8000 \
            -e ENVIRONMENT=test \
            -e APP_VERSION=${{ github.sha }} \
            ${{ env.IMAGE_TAG }}
          sleep 5
          curl -sf http://localhost:8000/health
          echo "::notice::MOCK deployed to test environment"

      - name: Schemathesis API tests
        run: |
          pip install schemathesis
          schemathesis run \
            --base-url=http://localhost:8000 \
            --checks all \
            openapi/openapi.yaml

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000
          allow_issue_writing: false

      - name: Full E2E tests
        run: |
          pip install -r requirements-dev.txt
          BASE_URL=http://localhost:8000 pytest tests/e2e -v -m e2e

      - name: Mock promote digest (test-approved)
        run: |
          echo "::notice::MOCK promote ${{ env.IMAGE_TAG }} → test-approved"
          echo "test-approved=${{ github.sha }}" >> "$GITHUB_OUTPUT"
        id: promote

      - name: Write deploy record
        if: always()
        run: |
          mkdir -p deploy-artifacts
          cat > deploy-artifacts/deploy-test.json <<EOF
          {
            "environment": "test",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "image": "${{ env.IMAGE_TAG }}",
            "mock_registry": "${{ env.MOCK_REGISTRY }}",
            "promoted_tag": "test-approved",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "simulated-success"
          }
          EOF

      - name: Upload deploy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-test-${{ github.sha }}
          path: deploy-artifacts/

      - name: Stop container
        if: always()
        run: docker rm -f api
